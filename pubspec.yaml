name: osca_viewer
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  file_picker: ^8.0.3     # 更新至最新 8.0 兼容手机、桌面所有平台
  provider: ^6.1.2        # 使用最新的强类型安全 Provider
  path_provider: ^2.1.3   
  path: ^1.9.0
  http: ^1.2.1
  crypto: ^3.0.3          # 计算 SHA256 必备的加解密库最新稳定版
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1   # 对齐官方的 Dart 3 Lints

flutter:
  uses-material-design: true